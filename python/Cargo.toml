[package]
name = "lazy-zip-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_lazy_zip"
crate-type = ["cdylib"]

[dependencies]
lazy-zip-core = { path = "../core" }
pyo3 = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
tokio-util = "0.7"
futures = "0.3"

[build-dependencies]
pyo3-build-config = "0.29"
